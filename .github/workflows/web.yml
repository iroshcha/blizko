name: Test Web client
on:
  push:
    branches: [main, codex/windows-app]
    paths: ['web/**', 'core/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'core/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build && npm test
        working-directory: web
      - name: Verify embedded web assets match sources
        run: git diff --exit-code -- core/webapp/assets
      - name: Build server and native interoperability fixture
        working-directory: core
        run: |
          mkdir -p ../.tools
          go test -race ./...
          go build -trimpath -o ../.tools/Blizko.WebTestServer.exe ./server
          go build -trimpath -o ../.tools/Blizko.WebTestPeer.exe ./webapp/testpeer
      - run: node web/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Test Chromium and WebKit
        run: node web/tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Web-check-reports
          path: |
            .tools/web-checks/*.png
            .tools/web-checks/result.txt
