name: Build Android and iPhone
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - name: Test shared core
        working-directory: core
        run: go test -race -tags=ts_omit_logtail ./mobile
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA for SideStore
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Blizko-iPhone-unsigned
          path: dist/Blizko-unsigned.ipa
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build embedded Tailscale and APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd core
          go test -race -tags=ts_omit_logtail ./mobile
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/amd64 -tags=ts_omit_logtail -androidapi 26 -ldflags='-s -w' -o ../app/libs/mobile.aar ./mobile
          cd ..
          gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Blizko-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
