name: Build Windows
on:
  push:
    branches: [main, codex/windows-app]
    paths: ['core/**', 'windows/**', 'scripts/*windows*.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['core/**', 'windows/**', 'scripts/*windows*.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/iroh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - name: Download pinned QR dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/zxing.net/0.16.11/zxing.net.0.16.11.nupkg' -OutFile .tools/zxing.zip
          if ((Get-FileHash .tools/zxing.zip -Algorithm SHA256).Hash -ne '7D39234D668E558B3D374D18116ED57021D7C0DF482801F1E1DB4F1DB9314EC3') { throw 'QR package hash mismatch' }
          Expand-Archive .tools/zxing.zip .tools/zxing
      - name: Build native Windows app and test core
        shell: pwsh
        run: ./scripts/build-windows.ps1 -RustTarget x86_64-pc-windows-msvc
      - name: Test UI, QR and protected storage
        shell: pwsh
        run: |
          $test = Start-Process ./dist/windows/Blizko.exe -ArgumentList @('--self-test', "$env:RUNNER_TEMP\blizko-ui") -WindowStyle Hidden -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\blizko-ui\self-test.txt"
          if ($test.ExitCode -ne 0) { throw 'Windows interface checks failed' }
      - name: Test delayed send and concurrent diagnostics
        shell: pwsh
        run: ./scripts/test-windows-interactions.ps1 -OutputDirectory "$env:RUNNER_TEMP\blizko-interactions"
      - name: Test signed updates, rollback and restart
        shell: pwsh
        run: ./scripts/test-windows-updates.ps1 -OutputDirectory "$env:RUNNER_TEMP\blizko-updates"
      - name: Test real Windows relay delivery and restart
        shell: pwsh
        run: ./scripts/test-windows-local.ps1 -TestDirectory "$env:RUNNER_TEMP\blizko-local-network"
      - name: Test public relay delivery and restart
        shell: pwsh
        run: |
          $test = Start-Process ./dist/windows/Blizko.exe -ArgumentList @('--network-test', "$env:RUNNER_TEMP\blizko-network") -WindowStyle Hidden -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\blizko-network\network-test.txt"
          if ($test.ExitCode -ne 0) { throw 'Windows delivery checks failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-check-reports
          path: |
            ${{ runner.temp }}/blizko-ui/*.txt
            ${{ runner.temp }}/blizko-ui/*preview.png
            ${{ runner.temp }}/blizko-interactions/*.txt
            ${{ runner.temp }}/blizko-interactions/*preview.png
            ${{ runner.temp }}/blizko-updates/updates.txt
            ${{ runner.temp }}/blizko-updates/update-errors.txt
            ${{ runner.temp }}/blizko-local-network/*.txt
            ${{ runner.temp }}/blizko-network/*.txt
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath dist/Blizko-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Blizko-Windows-x64
          path: dist/Blizko-Windows-x64.zip
          retention-days: 14
