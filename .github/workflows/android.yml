name: Build Android and server transport
on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-app]
    paths: ['core/**', 'app/**', 'scripts/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test shared core, broker and diagnostic retention
        working-directory: core
        run: go test -race ./...
      - name: Build Android
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd core
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          gomobile init
          mkdir -p ../app/libs
          gomobile bind -target=android/arm64,android/amd64 -androidapi 26 -ldflags='-s -w' -o ../app/libs/mobile.aar ./mobile
          cd ..
          gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:lintRelease :app:lintDebug
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/blizko-release-badging.txt
          if grep -q '^application-debuggable' /tmp/blizko-release-badging.txt; then exit 1; fi
      - name: Run Android UI, QR, APK and encrypted delivery checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/blizko-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n blizko-ci -k 'system-images;android-35;google_apis;x86_64' -p "$ANDROID_AVD_HOME/blizko-ci.avd" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -q '^blizko-ci$'
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd blizko-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/blizko-emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" || true' EXIT
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          timeout 180 adb wait-for-device || { cat /tmp/blizko-emulator.log; exit 1; }
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]; then break; fi
            sleep 2
          done
          [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == '1' ]]
          adb shell input keyevent 82
          (cd core && go build -o /tmp/blizko-server ./server)
          /tmp/blizko-server > /tmp/blizko-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$emulator_pid" "$server_pid" || true' EXIT
          adb reverse tcp:3340 tcp:3340
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm grant ru.blizko.chat android.permission.POST_NOTIFICATIONS
          adb shell am instrument -w -r -e diagnostics true ru.blizko.chat.test/ru.blizko.chat.QrAndUpdateTest | tee /tmp/blizko-diagnostics.txt
          grep -q 'INSTRUMENTATION_CODE: -1' /tmp/blizko-diagnostics.txt
          adb shell am instrument -w -r -e diagnostics true -e mode power ru.blizko.chat.test/ru.blizko.chat.QrAndUpdateTest | tee /tmp/blizko-diagnostics-power.txt
          grep -q 'INSTRUMENTATION_CODE: -1' /tmp/blizko-diagnostics-power.txt
          adb shell am instrument -w -r ru.blizko.chat.test/ru.blizko.chat.QrAndUpdateTest | tee /tmp/blizko-instrumentation.txt
          grep -q 'INSTRUMENTATION_CODE: -1' /tmp/blizko-instrumentation.txt
          adb root
          adb wait-for-device
          adb shell am start-foreground-service -n ru.blizko.chat/.ChatService
          sleep 3
          old_pid="$(adb shell pidof ru.blizko.chat | tr -d '\r')"
          [[ -n "$old_pid" ]]
          adb shell kill -9 "$old_pid"
          new_pid=''
          for attempt in $(seq 1 60); do
            new_pid="$(adb shell pidof ru.blizko.chat | tr -d '\r' || true)"
            if [[ -n "$new_pid" && "$new_pid" != "$old_pid" ]]; then break; fi
            sleep 1
          done
          [[ -n "$new_pid" && "$new_pid" != "$old_pid" ]]
          sleep 3
          adb shell dumpsys activity services ru.blizko.chat > /tmp/blizko-service-restart.txt
          grep -q 'isForeground=true' /tmp/blizko-service-restart.txt
          adb shell am instrument -w -r -e stopOnly true ru.blizko.chat.test/ru.blizko.chat.QrAndUpdateTest | tee /tmp/blizko-service-stop.txt
          grep -q 'INSTRUMENTATION_CODE: -1' /tmp/blizko-service-stop.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: Android-check-reports
          path: |
            /tmp/blizko-instrumentation.txt
            /tmp/blizko-diagnostics.txt
            /tmp/blizko-diagnostics-power.txt
            /tmp/blizko-emulator.log
            /tmp/blizko-release-badging.txt
            /tmp/blizko-service-restart.txt
            /tmp/blizko-service-stop.txt
            app/build/reports/lint-results-*.html
      - uses: actions/upload-artifact@v4
        with:
          name: Blizko-Android
          path: |
            app/libs/mobile.aar
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 7
