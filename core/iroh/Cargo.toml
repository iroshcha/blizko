[package]
name = "blizko-iroh"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
n0-watcher = "1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
hex = "0.4"
# Newer libc releases removed Apple networking types still used by netwatch.
# Match the compatible version used by the upstream iroh mobile bindings.
libc = "=0.2.186"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "=0.1.1"

[target.'cfg(windows)'.dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[profile.release]
opt-level = "s"
debug = false
strip = "debuginfo"


