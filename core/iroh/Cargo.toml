[package]
name = "blizko-iroh"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring"] }
n0-watcher = "1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = "s"
debug = false
strip = "debuginfo"

[patch.crates-io]
# Upstream 0.46.3 uses a macOS-only libc struct on iOS. See the one-function
# platform guard in vendor/netdev-0.46.3/src/os/darwin/ipv6_addr_flags.rs.
netdev = { path = "vendor/netdev-0.46.3" }

